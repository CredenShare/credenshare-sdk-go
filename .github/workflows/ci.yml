name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the failure the drift job catches is not caused by a commit here. The wire
  # specification can move in the application's repository and leave this SDK silently behind,
  # and nobody would push anything for CI to notice.
  schedule:
    - cron: "29 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.21", "1.22", "1.23", "1.24"]
        include:
          # The crypto is portable; line endings are not, and Windows is where a CRLF checkout
          # would break the embedded fixture's pinned digest.
          - os: windows-latest
            go: "1.22"
          - os: macos-latest
            go: "1.24"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: The module must have no dependencies
        # Standard library only, asserted rather than assumed. A dependency added in a hurry
        # is a dependency nobody audits, and this package's whole claim is that it encrypts
        # correctly with nothing else in the way.
        run: |
          if [ -s go.sum ]; then
            echo "::error::go.sum is not empty; this module is meant to have no dependencies"
            cat go.sum
            exit 1
          fi
        shell: bash

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race

      - name: Self-check the built binary
        # Exactly what a user runs after installing. Running it here means a broken checker
        # cannot ship: a self-check that always passes is worse than none, because it turns an
        # unverified installation into one somebody believes is verified.
        run: go run ./cmd/credenshare-conformance -v

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  conformance-drift:
    name: the fixture still matches the published spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Compare the embedded fixture against the published one
        # THE check this job exists for.
        #
        # The application and the four SDKs share no code, deliberately: a package the
        # production application depended on would mean a compromised publish is a compromised
        # application. The cost of that decision is drift, and drift here does not fail a test
        # in normal use — it produces content that can never be decrypted, discovered by a
        # customer when a link does not open.
        #
        # The URL is configuration rather than a constant because the specification lives in a
        # private repository, so this needs a URL the runner can actually reach.
        env:
          # Defaults to the published fixture, so drift detection runs with no
          # configuration. It was OFF in every repo until the spec was published,
          # because the variable had nowhere reachable to point — the one mechanism
          # holding five implementations together had never actually run.
          CREDENSHARE_VECTORS_URL: ${{ vars.CREDENSHARE_VECTORS_URL || 'https://raw.githubusercontent.com/CredenShare/credenshare-spec/main/conformance/vectors.v1.json' }}
        run: |
          if [ -z "${CREDENSHARE_VECTORS_URL}" ]; then
            # Loud, not silent. A skipped drift check reads as a passing one on the summary
            # page, and this is the single job whose silence is expensive.
            echo "::warning title=Drift detection is NOT running::CREDENSHARE_VECTORS_URL resolved empty, which should be impossible now that it defaults to the published fixture. Set the repository variable CREDENSHARE_VECTORS_URL to a reachable copy of the published vectors.v1.json. Until then nothing verifies that this SDK's fixture matches the specification, and divergence will surface as content that cannot be decrypted."
          fi
          go test -run TestTheEmbeddedFixture -v ./...
